#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - git
  - nginx
  - certbot
  - python3-certbot-nginx

runcmd:
  # Install Docker engine properly
  - apt-get install -y ca-certificates curl
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo \"$VERSION_CODENAME\") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Start Docker
  - systemctl enable docker
  - systemctl start docker

  # Clone repo
  - cd /opt
  - git clone https://github.com/muhammadharis-web/wherehouse-os-.git order-fulfillment
  - cd order-fulfillment/order-fulfillment-coordinator

  # Create .env file
  - cp .env.example .env

  # Pull and deploy
  - docker compose -f docker-compose.prod.yml pull
  - docker compose -f docker-compose.prod.yml up -d

  # Setup Caddy SSL if domain is provided
  - if [ -n "${domain_name}" ]; then
      sed -i "s/your-domain.com/${domain_name}/g" infra/caddy/Caddyfile;
      docker compose -f docker-compose.prod.yml restart caddy;
    fi

  # Firewall - open ports
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

final_message: "FulfillOS deployed at $(curl -s ifconfig.me)"
