services:
  postgres:
    # Preserve the verified existing OCI infrastructure during application recovery.
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillment}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    # Readiness is probed by the API; do not assume curl exists in this image.

  api:
    # Reap orphaned probe processes; the old OCI PID 1 accumulated ~1,000 zombies.
    init: true
    image: &api-image ${API_IMAGE_REF:-ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/fulfillment-api:${TAG:?TAG is required}}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "8000"
    environment: &app-environment
      APP_NAME: "FulfillOS"
      APP_VERSION: "${APP_VERSION:-0.1.0}"
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fulfillment}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fulfillment}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-fulfillment}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fulfillment}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "${JWT_EXPIRATION_MINUTES:-60}"
      CORS_ORIGINS: "${FRONTEND_URL:-http://localhost:3000}"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required}
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:?INTEGRATION_SECRET_KEY is required}
      RESET_EMAIL_REDIRECT_URL: "${RESET_EMAIL_REDIRECT_URL:-${FRONTEND_URL:-http://localhost:3000}}"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1536}"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_DEFAULT: "${RATE_LIMIT_DEFAULT:-120/minute}"
      RATE_LIMIT_AUTH: "${RATE_LIMIT_AUTH:-10/minute}"
      RATE_LIMIT_CHAT: "${RATE_LIMIT_CHAT:-30/minute}"
      SHIPMENT_POLL_INTERVAL_SECONDS: "${SHIPMENT_POLL_INTERVAL_SECONDS:-900}"
      MAX_ALLOWED_COST_INCREASE_PCT: "${MAX_ALLOWED_COST_INCREASE_PCT:-40.0}"
      MAX_NOTIFICATIONS_PER_ORDER: "${MAX_NOTIFICATIONS_PER_ORDER:-4}"
      FAILED_DELIVERY_THRESHOLD_PCT: "${FAILED_DELIVERY_THRESHOLD_PCT:-10.0}"
      SLA_CRITICAL_HOURS: "${SLA_CRITICAL_HOURS:-2}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER:-}"
      SENDGRID_API_KEY: "${SENDGRID_API_KEY:-}"
      SENDGRID_FROM_EMAIL: "${SENDGRID_FROM_EMAIL:-noreply@fulfillment.com}"
      EASYPOST_API_KEY: "${EASYPOST_API_KEY:-}"
      SMARTYSTREETS_AUTH_ID: "${SMARTYSTREETS_AUTH_ID:-}"
      SMARTYSTREETS_AUTH_TOKEN: "${SMARTYSTREETS_AUTH_TOKEN:-}"
      ODOO_URL: "${ODOO_URL:-}"
      ODOO_DB: "${ODOO_DB:-}"
      ODOO_USERNAME: "${ODOO_USERNAME:-}"
      ODOO_PASSWORD: "${ODOO_PASSWORD:-}"
      ODOO_VERIFY_SSL: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  celery-worker:
    init: true
    image: *api-image
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    command: celery -A fulfillment.tasks worker --loglevel=info --queues=celery,monitoring,health,readiness --concurrency=2
    restart: unless-stopped
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fulfillment}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fulfillment}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:?INTEGRATION_SECRET_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    healthcheck:
      # Control ping needs no application imports or work-queue backlog traversal.
      test: ["CMD-SHELL", "celery -b \"$$CELERY_BROKER_URL\" inspect ping -d celery@$$HOSTNAME --timeout=5 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    init: true
    image: *api-image
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    command: celery -A fulfillment.tasks beat --loglevel=info
    restart: unless-stopped
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fulfillment}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fulfillment}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    # A worker ping does not prove that the scheduler process is healthy.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE_REF:-ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/fulfillment-ui:${TAG:?TAG is required}}
    build:
      context: ../agent-platform-ui-main/agent-platform-ui-main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${FRONTEND_URL:-http://localhost:3000}"
        BACKEND_URL: "${BACKEND_URL:-http://api:8000}"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NEXTAUTH_SECRET: ${JWT_SECRET}
      NEXTAUTH_URL: "${FRONTEND_URL:-http://localhost:3000}"
      BACKEND_URL: "${BACKEND_URL:-http://api:8000}"
    depends_on:
      - api

  caddy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  qdrant_storage:
  qdrant_snapshots:
