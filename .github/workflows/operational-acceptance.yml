name: Isolated operational acceptance

on:
  push:
    branches: [codex/operational-readiness]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE_OWNER: local-test
      TAG: acceptance
      POSTGRES_DB: worker_acceptance
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: disposable-acceptance-password
      JWT_SECRET: disposable-jwt-signing-key-for-linux-acceptance-only
      WEBHOOK_SECRET: disposable-webhook-key-for-linux-acceptance-only
      INTEGRATION_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OPENAI_API_KEY: ""
      SHIPMENT_POLL_INTERVAL_SECONDS: "4"
      COMPOSE_PROJECT_NAME: warehouse-acceptance
      COMPOSE_FILE: docker-compose.prod.yml:acceptance.override.yml
    defaults:
      run:
        working-directory: order-fulfillment-coordinator
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Build and start production images
        run: |
          mkdir -p "$RUNNER_TEMP/warehouse-evidence"
          cat > acceptance.override.yml <<'EOF'
          services:
            postgres:
              ports: ["127.0.0.1:55471:5432"]
            redis:
              ports: ["127.0.0.1:56379:6379"]
            frontend:
              ports: ["127.0.0.1:53000:3000"]
          EOF
          docker compose config --quiet
          docker compose build api frontend
          docker compose up -d --wait postgres redis qdrant
          docker compose run --rm --no-deps api alembic upgrade head
          docker compose up -d --no-build api frontend celery-worker celery-beat
          for attempt in $(seq 1 35); do
            if docker compose exec -T api python - < infra/scripts/check_readiness.py http://localhost:8000/health; then break; fi
            if [ "$attempt" -eq 35 ]; then exit 1; fi
            sleep 4
          done
          curl --retry 10 --retry-all-errors --retry-delay 2 --fail --silent http://127.0.0.1:53000/ -o "$RUNNER_TEMP/warehouse-evidence/landing.html"
          curl --fail --silent http://127.0.0.1:53000/health -o "$RUNNER_TEMP/warehouse-evidence/frontend-health.json"
          for attempt in $(seq 1 15); do
            if docker compose exec -T postgres psql -U acceptance -d worker_acceptance -Atc "SELECT count(*) FROM public.monitor_task_results" | grep -E '^[1-9][0-9]*$'; then break; fi
            if [ "$attempt" -eq 15 ]; then exit 1; fi
            sleep 2
          done
          docker compose stop celery-beat celery-worker
      - name: PostgreSQL and Redis prefork recovery
        working-directory: order-fulfillment-coordinator/apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://acceptance:disposable-acceptance-password@127.0.0.1:55471/worker_acceptance
          CELERY_BROKER_URL: redis://127.0.0.1:56379/13
          CELERY_RESULT_BACKEND: redis://127.0.0.1:56379/14
          ALLOW_AUTOMATIC_REROUTING: "false"
          WAREHOUSE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/warehouse-evidence
        run: |
          uv sync --frozen --python 3.12
          export WAREHOUSE_ACCEPTANCE_REDIS_CONTAINER="$(cd ../.. && docker compose ps -q redis)"
          test -n "$WAREHOUSE_ACCEPTANCE_REDIS_CONTAINER"
          uv run --no-sync python tests/verify_celery_recovery.py
          (cd ../.. && docker compose exec -T postgres createdb -U acceptance inventory_test)
          export WAREHOUSE_INVENTORY_TEST_DATABASE="${DATABASE_URL%/*}/inventory_test"
          DATABASE_URL="$WAREHOUSE_INVENTORY_TEST_DATABASE" uv run --no-sync alembic upgrade head
          env -u DATABASE_URL uv run --no-sync pytest -q tests --junitxml="$WAREHOUSE_ACCEPTANCE_OUTPUT/backend-regression.xml"
      - name: Capture container evidence
        if: always()
        run: |
          docker compose ps -a > "$RUNNER_TEMP/warehouse-evidence/compose-status.txt"
          docker compose logs --no-color > "$RUNNER_TEMP/warehouse-evidence/compose-logs.txt"
          docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-operational-evidence
          path: ${{ runner.temp }}/warehouse-evidence
