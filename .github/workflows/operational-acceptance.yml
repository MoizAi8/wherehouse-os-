name: Isolated operational acceptance

on:
  push:
    branches: [codex/operational-readiness]

permissions:
  contents: read

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-platform-ui-main/agent-platform-ui-main
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: agent-platform-ui-main/agent-platform-ui-main/package-lock.json
      - name: Install locked dependencies with strict peers
        run: npm ci --include=dev --strict-peer-deps --no-audit --no-fund
      - name: Check TypeScript
        run: npx --no-install tsc --noEmit
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest test suite
        run: npm run test -- --run
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Required by Next.js for build-time checks
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build production frontend
        run: npm run build
        env:
          BACKEND_URL: http://api:8000
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify built authentication routes
        run: npm run test:auth

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE_OWNER: local-test
      TAG: acceptance
      POSTGRES_DB: worker_acceptance
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: disposable-acceptance-password
      JWT_SECRET: disposable-jwt-signing-key-for-linux-acceptance-only
      WEBHOOK_SECRET: disposable-webhook-key-for-linux-acceptance-only
      INTEGRATION_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OPENAI_API_KEY: ""
      SHIPMENT_POLL_INTERVAL_SECONDS: "4"
      COMPOSE_PROJECT_NAME: warehouse-acceptance
      COMPOSE_FILE: docker-compose.prod.yml:acceptance.override.yml
    defaults:
      run:
        working-directory: order-fulfillment-coordinator
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Build and start production images
        run: |
          mkdir -p "$RUNNER_TEMP/warehouse-evidence"
          cat > acceptance.override.yml <<'EOF'
          services:
            postgres:
              ports: ["127.0.0.1:55471:5432"]
            redis:
              ports: ["127.0.0.1:56379:6379"]
            frontend:
              ports: ["127.0.0.1:53000:3000"]
          EOF
          docker compose config --quiet
          docker compose build api frontend
          docker compose up -d --wait postgres redis qdrant
          docker compose run --rm --no-deps api alembic upgrade head
          docker compose up -d --no-build api frontend celery-worker celery-beat
          for attempt in $(seq 1 35); do
            if docker compose exec -T api python - < infra/scripts/check_readiness.py http://localhost:8000/health; then break; fi
            if [ "$attempt" -eq 35 ]; then exit 1; fi
            sleep 4
          done
          curl --retry 10 --retry-all-errors --retry-delay 2 --fail --silent http://127.0.0.1:53000/ -o "$RUNNER_TEMP/warehouse-evidence/landing.html"
          curl --fail --silent http://127.0.0.1:53000/health -o "$RUNNER_TEMP/warehouse-evidence/frontend-health.json"
          for attempt in $(seq 1 15); do
            if docker compose exec -T postgres psql -U acceptance -d worker_acceptance -Atc "SELECT count(*) FROM public.monitor_task_results" | grep -E '^[1-9][0-9]*$'; then break; fi
            if [ "$attempt" -eq 15 ]; then exit 1; fi
            sleep 2
          done
          docker compose stop celery-beat celery-worker
      - name: PostgreSQL and Redis prefork recovery
        working-directory: order-fulfillment-coordinator/apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://acceptance:disposable-acceptance-password@127.0.0.1:55471/worker_acceptance
          CELERY_BROKER_URL: redis://127.0.0.1:56379/13
          CELERY_RESULT_BACKEND: redis://127.0.0.1:56379/14
          ALLOW_AUTOMATIC_REROUTING: "false"
          WAREHOUSE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/warehouse-evidence
        run: |
          uv sync --frozen --python 3.12
          uv run --no-sync ruff check .
          uv run --no-sync mypy src
          export WAREHOUSE_ACCEPTANCE_REDIS_CONTAINER="$(cd ../.. && docker compose ps -q redis)"
          test -n "$WAREHOUSE_ACCEPTANCE_REDIS_CONTAINER"
          uv run --no-sync python tests/verify_celery_recovery.py
          (cd ../.. && docker compose exec -T postgres createdb -U acceptance inventory_test)
          export WAREHOUSE_INVENTORY_TEST_DATABASE="${DATABASE_URL%/*}/inventory_test"
          DATABASE_URL="$WAREHOUSE_INVENTORY_TEST_DATABASE" uv run --no-sync alembic upgrade head
          (cd ../.. && docker compose exec -T postgres createdb -U acceptance booking_acceptance)
          export WAREHOUSE_BOOKING_TEST_DATABASE="${DATABASE_URL%/*}/booking_acceptance"
          DATABASE_URL="$WAREHOUSE_BOOKING_TEST_DATABASE" uv run --no-sync alembic upgrade head
          env -u DATABASE_URL uv run --no-sync pytest -q tests --junitxml="$WAREHOUSE_ACCEPTANCE_OUTPUT/backend-regression.xml"
      - name: Carrier booking persistence and worker-loss recovery
        working-directory: order-fulfillment-coordinator/apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://acceptance:disposable-acceptance-password@127.0.0.1:55471/booking_acceptance
          CELERY_BROKER_URL: redis://127.0.0.1:56379/9
          CELERY_RESULT_BACKEND: redis://127.0.0.1:56379/10
          CARRIER_BOOKING_PROVIDER: sandbox
          CARRIER_SANDBOX_ENABLED: "true"
          WAREHOUSE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/warehouse-evidence
        run: uv run --no-sync python tests/verify_booking_worker.py
      - name: 500 PostgreSQL warehouse scenarios with real prefork worker
        working-directory: order-fulfillment-coordinator/apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://acceptance:disposable-acceptance-password@127.0.0.1:55471/matrix_acceptance
          CELERY_BROKER_URL: redis://127.0.0.1:56379/11
          CELERY_RESULT_BACKEND: redis://127.0.0.1:56379/12
          ALLOW_AUTOMATIC_REROUTING: "false"
        run: |
          (cd ../.. && docker compose exec -T postgres createdb -U acceptance matrix_acceptance)
          uv run --no-sync alembic upgrade head
          uv run --no-sync celery -A fulfillment.tasks.monitor_cycle worker --pool=prefork --concurrency=2 -Q monitoring -n matrix@localhost -l WARNING > "$RUNNER_TEMP/warehouse-evidence/matrix-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid"; wait "$worker_pid" || true' EXIT
          uv run --no-sync pytest -q tests/verify_operational_matrix.py --junitxml="$RUNNER_TEMP/warehouse-evidence/warehouse-matrix.xml" -o junit_family=legacy
      - name: Restore a fresh PostgreSQL release backup in isolation
        run: |
          DOCKER=(docker)
          COMPOSE=(docker compose)
          export RELEASE_BACKUP_DIR="$RUNNER_TEMP/private-backup"
          ( source infra/scripts/verify_release_backup.sh )
          cp "$RELEASE_BACKUP_DIR"/*/verified "$RUNNER_TEMP/warehouse-evidence/backup-verification.txt"
      - name: Capture container evidence
        if: always()
        run: |
          docker compose ps -a > "$RUNNER_TEMP/warehouse-evidence/compose-status.txt"
          docker compose logs --no-color > "$RUNNER_TEMP/warehouse-evidence/compose-logs.txt"
          docker compose down -v
      - name: Generate operational evidence ledger
        if: always()
        run: python3 apps/api/tests/write_operational_evidence.py "$RUNNER_TEMP/warehouse-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-operational-evidence
          path: ${{ runner.temp }}/warehouse-evidence
