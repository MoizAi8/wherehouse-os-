name: Deploy to Oracle Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Pin exact versions to match local development [ARCHITECT-LOCK: DO NOT OVERWRITE]
  NODE_VERSION: '20.18.0'
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.5.4'
  API_IMAGE: fulfillment-api
  FRONTEND_IMAGE: fulfillment-ui

jobs:
  test-api:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-fulfillment-coordinator/apps/api
    # Service containers for integration tests [ARCHITECT-LOCK: DO NOT OVERWRITE]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fulfillment_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --group dev
      - name: Run ruff linter
        run: uv run --group dev ruff check . --no-fix
      - name: Run mypy type checker
        run: uv run --group dev mypy src/ --ignore-missing-imports
      - name: Run pytest test suite
        run: uv run --group dev pytest tests/ -v
        env:
          # Database & Cache (provided by service containers)
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fulfillment_test
          REDIS_URL: redis://localhost:6379/0
          # Authentication & Security
          JWT_SECRET: test-secret-key-for-ci-testing-only
          JWT_ALGORITHM: HS256
          WEBHOOK_SECRET: test-webhook-secret-for-ci
          INTEGRATION_SECRET_KEY: test-integration-secret-for-ci
          # AI & External Services (dummy values for CI - tests use mocks)
          OPENAI_API_KEY: sk-test-dummy-key-for-ci
          OPENAI_BASE_URL: ""
          OPENAI_MODEL: gpt-4o-mini
          EMBEDDING_MODEL: text-embedding-3-small
          EMBEDDING_DIMENSIONS: "1536"
          QDRANT_URL: http://localhost:6333
          QDRANT_API_KEY: ""
          # Rate limiting
          RATE_LIMIT_ENABLED: "true"
          RATE_LIMIT_DEFAULT: "120/minute"
          RATE_LIMIT_AUTH: "10/minute"
          RATE_LIMIT_CHAT: "30/minute"
          # Celery
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          # Feature flags
          DEBUG: "true"
          # Optional integrations (empty for CI)
          TWILIO_ACCOUNT_SID: ""
          TWILIO_AUTH_TOKEN: ""
          TWILIO_PHONE_NUMBER: ""
          SENDGRID_API_KEY: ""
          SENDGRID_FROM_EMAIL: "noreply@fulfillment.com"
          ODOO_URL: ""
          ODOO_DB: ""
          ODOO_USERNAME: ""
          ODOO_PASSWORD: ""
          ODOO_VERIFY_SSL: "true"
          MAX_ALLOWED_COST_INCREASE_PCT: "40.0"
          MAX_NOTIFICATIONS_PER_ORDER: "4"
          SHIPMENT_POLL_INTERVAL_SECONDS: "900"
          FAILED_DELIVERY_THRESHOLD_PCT: "10.0"
          SLA_CRITICAL_HOURS: "2"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-platform-ui-main/agent-platform-ui-main
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: agent-platform-ui-main/agent-platform-ui-main/package-lock.json
      - name: "Install dependencies (force-clean for native bindings) [ARCHITECT-LOCK: DO NOT OVERWRITE]"
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest test suite
        run: npm run test -- --run
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Required by Next.js for build-time checks
          NEXT_TELEMETRY_DISABLED: "1"

  build-and-push:
    name: Build & Push Images
    needs: [test-api, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: "Sanitize Repository Owner to Lowercase [ARCHITECT-LOCK: DO NOT OVERWRITE]"
        run: |
          echo "REPO_OWNER_LOWERCASE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers (Backend)
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-backend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-backend-

      - name: Cache Docker layers (Frontend)
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-buildx-frontend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-frontend-

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: agent-platform-ui-main/agent-platform-ui-main/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('agent-platform-ui-main/agent-platform-ui-main/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('order-fulfillment-coordinator/apps/api/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: order-fulfillment-coordinator/apps/api
          target: production
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWERCASE }}/${{ env.API_IMAGE }}:latest
            ghcr.io/${{ env.REPO_OWNER_LOWERCASE }}/${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UV_VERSION=${{ env.UV_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: agent-platform-ui-main/agent-platform-ui-main
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWERCASE }}/${{ env.FRONTEND_IMAGE }}:latest
            ghcr.io/${{ env.REPO_OWNER_LOWERCASE }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}
            BACKEND_URL=${{ secrets.BACKEND_URL }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            NEXT_TELEMETRY_DISABLED=1

  deploy:
    name: Deploy to OCI
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          bash install.sh --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Verify OCI Secrets
        run: |
          if [ -z "${{ secrets.OCI_USER }}" ] || [ -z "${{ secrets.OCI_TENANCY }}" ] || [ -z "${{ secrets.OCI_REGION }}" ] || [ -z "${{ secrets.OCI_KEY }}" ] || [ -z "${{ secrets.OCI_FINGERPRINT }}" ]; then
            echo "Error: OCI secrets are not configured in GitHub repository settings."
            echo "Required: OCI_USER, OCI_TENANCY, OCI_REGION, OCI_KEY, OCI_FINGERPRINT"
            exit 1
          fi

      # Ensure all OCI-related secrets (OCI_USER, OCI_TENANCY, OCI_FINGERPRINT, OCI_REGION, OCI_KEY) are correctly defined in GitHub repository settings, as empty values will cause this step to fail.
      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY }}" >> ~/.oci/config
          echo "region=${{ secrets.OCI_REGION }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "${{ secrets.OCI_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config

      - name: Copy deploy files to instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "order-fulfillment-coordinator/,agent-platform-ui-main/"
          target: "~/fulfillment"

      - name: SSH and deploy with zero-downtime strategy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2 docker-buildx-plugin
              sudo systemctl enable --now docker
              sudo usermod -aG docker ubuntu
            fi
            cd ~/fulfillment/order-fulfillment-coordinator
            export TAG=${{ github.sha }}
            
            # Generate .env file from GitHub Secrets
            cat > .env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }}
            WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
            INTEGRATION_SECRET_KEY=${{ secrets.INTEGRATION_SECRET_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
            OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
            EMBEDDING_MODEL=${{ secrets.EMBEDDING_MODEL }}
            EMBEDDING_DIMENSIONS=${{ secrets.EMBEDDING_DIMENSIONS }}
            QDRANT_URL=${{ secrets.QDRANT_URL }}
            QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
            RATE_LIMIT_ENABLED=${{ secrets.RATE_LIMIT_ENABLED }}
            RATE_LIMIT_DEFAULT=${{ secrets.RATE_LIMIT_DEFAULT }}
            RATE_LIMIT_AUTH=${{ secrets.RATE_LIMIT_AUTH }}
            RATE_LIMIT_CHAT=${{ secrets.RATE_LIMIT_CHAT }}
            CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
            CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}
            DEBUG=${{ secrets.DEBUG }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}
            ODOO_URL=${{ secrets.ODOO_URL }}
            ODOO_DB=${{ secrets.ODOO_DB }}
            ODOO_USERNAME=${{ secrets.ODOO_USERNAME }}
            ODOO_PASSWORD=${{ secrets.ODOO_PASSWORD }}
            ODOO_VERIFY_SSL=${{ secrets.ODOO_VERIFY_SSL }}
            MAX_ALLOWED_COST_INCREASE_PCT=${{ secrets.MAX_ALLOWED_COST_INCREASE_PCT }}
            MAX_NOTIFICATIONS_PER_ORDER=${{ secrets.MAX_NOTIFICATIONS_PER_ORDER }}
            SHIPMENT_POLL_INTERVAL_SECONDS=${{ secrets.SHIPMENT_POLL_INTERVAL_SECONDS }}
            FAILED_DELIVERY_THRESHOLD_PCT=${{ secrets.FAILED_DELIVERY_THRESHOLD_PCT }}
            SLA_CRITICAL_HOURS=${{ secrets.SLA_CRITICAL_HOURS }}
            EOF
            
            # Pre-flight: free ports 80/443/5432/6379/6333 on host
            echo "=== Freeing ports 80, 443, 5432, 6379, 6333 ==="
            sudo systemctl stop nginx || true
            sudo systemctl disable nginx || true
            sudo systemctl stop apache2 || true
            sudo systemctl disable apache2 || true
            sudo systemctl stop redis-server || true
            sudo systemctl disable redis-server || true
            sudo systemctl stop postgresql || true
            sudo systemctl disable postgresql || true
            # Kill any process holding ports 80/443/5432/6379/6333
            sudo fuser -k 80/tcp 443/tcp 5432/tcp 6379/tcp 6333/tcp 2>/dev/null || true
            sudo ss -K dst = :80 || true
            sudo ss -K dst = :443 || true
            sudo ss -K dst = :5432 || true
            sudo ss -K dst = :6379 || true
            sudo ss -K dst = :6333 || true
            # Remove any dangling docker containers using host ports 80/443/5432/6379/6333
            sudo docker ps -a --filter "publish=80" --filter "publish=443" --filter "publish=5432" --filter "publish=6379" --filter "publish=6333" --format "{{.ID}}" | xargs -r sudo docker rm -f
            
            # Pull new images
            sudo docker compose -f docker-compose.prod.yml pull
            
            # Zero-downtime rebuild: remove orphans and rebuild [ARCHITECT-LOCK: DO NOT OVERWRITE]
            sudo docker compose -f docker-compose.prod.yml down -v --remove-orphans
            sudo docker compose -f docker-compose.prod.yml up -d --build
            # Debug: show Postgres logs immediately for troubleshooting
            sudo docker compose -f docker-compose.prod.yml logs postgres
            
            # Debug: wait for Postgres init and show logs if unhealthy
            sleep 10 && sudo docker logs order-fulfillment-coordinator-postgres-1 || true
            
            # Strict health polling with timeout [ARCHITECT-LOCK: DO NOT OVERWRITE]
            echo "Waiting for API health endpoint..."
            timeout 120 bash -c '
              until curl -sf http://localhost:8000/health | grep -qE "status.*ok"; do
                sleep 3
              done
            '
            
            # Verify PostgreSQL port
            timeout 30 bash -c 'until nc -z localhost 5432; do sleep 1; done'
            
            # Verify Caddy ports (replaces Nginx check) [ARCHITECT-LOCK: DO NOT OVERWRITE]
            timeout 30 bash -c 'until nc -z localhost 80 && nc -z localhost 443; do sleep 1; done'
            
            echo "[OK] Deploy successful - all health checks passed"
            sudo docker image prune -f