name: Deploy to Oracle Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  API_IMAGE: fulfillment-api
  FRONTEND_IMAGE: fulfillment-ui
  # Pin exact versions to match local development
  NODE_VERSION: '20.18.0'
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.5.4'

jobs:
  test-api:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-fulfillment-coordinator/apps/api
    # Service containers for integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fulfillment_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --group dev
      - name: Run ruff linter
        run: uv run --group dev ruff check . --no-fix
      - name: Run mypy type checker
        run: uv run --group dev mypy src/ --ignore-missing-imports
      - name: Run pytest test suite
        run: uv run --group dev pytest tests/ -v
        env:
          # Database & Cache (provided by service containers)
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fulfillment_test
          REDIS_URL: redis://localhost:6379/0
          # Authentication & Security
          JWT_SECRET: test-secret-key-for-ci-testing-only
          JWT_ALGORITHM: HS256
          WEBHOOK_SECRET: test-webhook-secret-for-ci
          INTEGRATION_SECRET_KEY: test-integration-secret-for-ci
          # AI & External Services (dummy values for CI - tests use mocks)
          OPENAI_API_KEY: sk-test-dummy-key-for-ci
          OPENAI_BASE_URL: ""
          OPENAI_MODEL: gpt-4o-mini
          EMBEDDING_MODEL: text-embedding-3-small
          EMBEDDING_DIMENSIONS: "1536"
          QDRANT_URL: http://localhost:6333
          QDRANT_API_KEY: ""
          # Rate limiting
          RATE_LIMIT_ENABLED: "true"
          RATE_LIMIT_DEFAULT: "120/minute"
          RATE_LIMIT_AUTH: "10/minute"
          RATE_LIMIT_CHAT: "30/minute"
          # Celery
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          # Feature flags
          DEBUG: "true"
          # Optional integrations (empty for CI)
          TWILIO_ACCOUNT_SID: ""
          TWILIO_AUTH_TOKEN: ""
          TWILIO_PHONE_NUMBER: ""
          SENDGRID_API_KEY: ""
          SENDGRID_FROM_EMAIL: "noreply@fulfillment.com"
          ODOO_URL: ""
          ODOO_DB: ""
          ODOO_USERNAME: ""
          ODOO_PASSWORD: ""
          ODOO_VERIFY_SSL: "true"
          MAX_ALLOWED_COST_INCREASE_PCT: "40.0"
          MAX_NOTIFICATIONS_PER_ORDER: "4"
          SHIPMENT_POLL_INTERVAL_SECONDS: "900"
          FAILED_DELIVERY_THRESHOLD_PCT: "10.0"
          SLA_CRITICAL_HOURS: "2"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-platform-ui-main/agent-platform-ui-main
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: agent-platform-ui-main/agent-platform-ui-main/package-lock.json
      - name: Install dependencies (ci for frozen lockfile)
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest test suite
        run: npm run test -- --run
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Required by Next.js for build-time checks
          NEXT_TELEMETRY_DISABLED: "1"

  build-and-push:
    name: Build & Push Images
    needs: [test-api, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: order-fulfillment-coordinator/apps/api
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }}
          # Build args for production build
          build-args: |
            UV_VERSION=${{ env.UV_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: agent-platform-ui-main/agent-platform-ui-main
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            NEXT_TELEMETRY_DISABLED=1

  deploy:
    name: Deploy to OCI
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          bash install.sh --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          oci setup config --cli-rc-file /dev/null --region ${{ secrets.OCI_REGION }} --tenancy-id ${{ secrets.OCI_TENANCY }} --user-id ${{ secrets.OCI_USER }} --key-file <(echo "${{ secrets.OCI_KEY }}") --fingerprint ${{ secrets.OCI_FINGERPRINT }}

      - name: Copy deploy files to instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "order-fulfillment-coordinator/docker-compose.prod.yml,order-fulfillment-coordinator/infra/"
          target: "/opt/fulfillment"
          strip_components: 1

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /opt/fulfillment
            export TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            sleep 15
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "[OK] Deploy successful"
              docker image prune -f
            else
              echo "[FAIL] Health check failed - rolling back"
              docker compose -f docker-compose.prod.yml down
              docker compose -f docker-compose.prod.yml up -d
              exit 1
            fi