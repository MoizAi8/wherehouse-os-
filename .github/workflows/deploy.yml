name: Deploy to Oracle Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  API_IMAGE: fulfillment-api
  FRONTEND_IMAGE: fulfillment-ui

jobs:
  test-api:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-fulfillment-coordinator/apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fulfillment_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --group dev ruff check . --no-fix
      - run: uv run --group dev mypy src/ --ignore-missing-imports
      - run: uv run --group dev pytest tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fulfillment_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-platform-ui-main/agent-platform-ui-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-platform-ui-main/agent-platform-ui-main/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 50
      - run: npm run test -- --run
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  build-and-push:
    name: Build & Push Images
    needs: [test-api, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: order-fulfillment-coordinator/apps/api
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: agent-platform-ui-main/agent-platform-ui-main
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}

  deploy:
    name: Deploy to OCI
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          bash install.sh --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          oci setup config --cli-rc-file /dev/null --region ${{ secrets.OCI_REGION }} --tenancy-id ${{ secrets.OCI_TENANCY }} --user-id ${{ secrets.OCI_USER }} --key-file <(echo "${{ secrets.OCI_KEY }}") --fingerprint ${{ secrets.OCI_FINGERPRINT }}

      - name: Copy deploy files to instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "order-fulfillment-coordinator/docker-compose.prod.yml,order-fulfillment-coordinator/infra/"
          target: "/opt/fulfillment"
          strip_components: 1

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /opt/fulfillment
            export TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            sleep 15
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "✅ Deploy successful"
              docker image prune -f
            else
              echo "❌ Health check failed — rolling back"
              docker compose -f docker-compose.prod.yml down
              docker compose -f docker-compose.prod.yml up -d
              exit 1
            fi
