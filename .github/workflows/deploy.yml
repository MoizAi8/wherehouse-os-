name: Read-only OCI release identity verification
on:
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
        required: true
      verify_gemini:
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  readback:
    if: github.ref == 'refs/heads/codex/oci-release-readback' && !inputs.deploy && !inputs.verify_gemini
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect approved release and running image identities only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          fingerprint: ${{ secrets.OCI_SSH_FINGERPRINT }}
          command_timeout: 2m
          script: |
            bash -s <<'READ_ONLY'
            set -euo pipefail
            expected=d6a876296064434ba2015f1f73dd804490269504
            release=$(cat "$HOME/fulfillment/deploy-state/current-release")
            case "$release" in "$HOME/fulfillment/releases/$expected-"*/order-fulfillment-coordinator) ;; *) echo 'Unexpected current release'; exit 1 ;; esac
            grep -Fx "TAG=$expected" "$release/release.env" >/dev/null
            DOCKER=(docker)
            if ! docker info >/dev/null 2>&1; then DOCKER=(sudo -n docker); "${DOCKER[@]}" info >/dev/null; fi
            printf 'DEPLOYED_SHA=%s\n' "$expected"
            for pair in api:API_IMAGE_REF frontend:FRONTEND_IMAGE_REF; do
                service=${pair%%:*}
                variable=${pair#*:}
                reference=$(sed -n "s/^$variable=//p" "$release/release.env")
                [[ "$reference" =~ ^ghcr.io/moizai8/fulfillment-(api|ui)@sha256:[a-f0-9]{64}$ ]] || exit 1
                container="order-fulfillment-coordinator-$service-1"
                actual=$("${DOCKER[@]}" inspect --format '{{.Config.Image}}' "$container")
                [[ "$actual" == "$reference" ]] || { echo 'Container differs from approved release manifest'; exit 1; }
                image_id=$("${DOCKER[@]}" inspect --format '{{.Image}}' "$container")
                [[ "$image_id" == "$("${DOCKER[@]}" image inspect --format '{{.Id}}' "$reference")" ]] || exit 1
                [[ "$("${DOCKER[@]}" inspect --format '{{.State.Running}}' "$container")" == true ]] || exit 1
                health=$("${DOCKER[@]}" inspect --format '{{.State.Health.Status}}' "$container")
                [[ "$health" == healthy ]] || exit 1
                printf 'SERVICE=%s REFERENCE=%s IMAGE_ID=%s HEALTH=%s\n' "$service" "$reference" "$image_id" "$health"
            done
            READ_ONLY
