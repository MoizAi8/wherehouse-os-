# Render Blueprint — FulfillOS demo deployment
# Free tier: web service (sleeps after 15min idle) + PostgreSQL (free 90 days)
# Celery/Redis/Qdrant: not included on free plan — backend degrades gracefully.
# Spec: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fulfillos-api
    runtime: docker
    dockerfilePath: order-fulfillment-coordinator/apps/api/Dockerfile
    dockerContext: order-fulfillment-coordinator/apps/api
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fulfillos-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://agent-platform-ui-main.vercel.app,http://localhost:3000
      - key: RESET_EMAIL_REDIRECT_URL
        value: https://agent-platform-ui-main.vercel.app
      # ── Secrets (set values in Render dashboard after first deploy) ──
      - key: JWT_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: INTEGRATION_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # ── Optional integrations (leave empty for demo) ──
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ODOO_URL
        sync: false

databases:
  - name: fulfillos-db
    databaseName: fulfillos
    user: fulfillos
    plan: free
    region: oregon
